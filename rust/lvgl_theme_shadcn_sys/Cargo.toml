[package]
name = "lvgl_theme_shadcn_sys"
description = "Raw no_std FFI bindings to the shadcn/ui-inspired LVGL 9 theme"
keywords = ["lvgl", "theme", "shadcn", "embedded", "no-std"]
categories = ["external-ffi-bindings", "embedded", "no-std", "gui"]
readme = "README.md"
links = "lvgl_theme_shadcn"
build = "build.rs"
include = [
    "/build.rs",
    "/src/**",
    "/tests/**",
    "/c/src/**",
    "/c/include/**",
    "/c/sources.cmake",
    "/generate-bindings.sh",
    "/README.md",
    "/LICENSE",
]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
bindgen = ["dep:bindgen"]

[build-dependencies]
cc = "1"
bindgen = { version = "0.72", optional = true }
