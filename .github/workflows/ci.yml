name: ci

on:
  push:
  pull_request:

jobs:
  c:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        color_format: [LV_COLOR_FORMAT_RGB565, LV_COLOR_FORMAT_XRGB8888]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DLV_THEME_SHADCN_WERROR=ON
          -DLV_THEME_SHADCN_TEST_COLOR_FORMAT=${{ matrix.color_format }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.compiler }}-${{ matrix.color_format }}
          path: build/screenshots/

  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Configure
        run: cmake -S examples/gallery -B build-gallery
      - name: Build
        run: cmake --build build-gallery --parallel
