name: ci

on:
  push:
  pull_request:

jobs:
  c:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        color_format: [LV_COLOR_FORMAT_RGB565, LV_COLOR_FORMAT_XRGB8888]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DLV_THEME_SHADCN_WERROR=ON
          -DLV_THEME_SHADCN_TEST_COLOR_FORMAT=${{ matrix.color_format }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.compiler }}-${{ matrix.color_format }}
          path: build/screenshots/

  sanitize:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build-asan
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_BUILD_TYPE=Debug
          -DLV_THEME_SHADCN_WERROR=ON
          -DLV_THEME_SHADCN_SANITIZE=ON
          -DLV_THEME_SHADCN_TEST_COLOR_FORMAT=LV_COLOR_FORMAT_XRGB8888
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Configure
        run: cmake -S examples/gallery -B build-gallery
      - name: Build
        run: cmake --build build-gallery --parallel

  esp-idf:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        working-directory: examples/esp_idf
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32 build

  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run -d examples/platformio
      - name: Run
        run: examples/platformio/.pio/build/native/program
      - name: Pack
        run: pio pkg pack -o "$RUNNER_TEMP"
