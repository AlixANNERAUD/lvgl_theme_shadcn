name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    if: github.repository_owner == 'AlixANNERAUD'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Version consistency
        run: |
          metadata=$(cargo metadata --format-version 1 --no-deps)
          theme=$(echo "$metadata" | jq -r '.packages[] | select(.name == "lvgl_theme_shadcn") | .version')
          sys=$(echo "$metadata" | jq -r '.packages[] | select(.name == "lvgl_theme_shadcn_sys") | .version')
          pin=$(echo "$metadata" | jq -r '.packages[] | select(.name == "lvgl_theme_shadcn") | .dependencies[] | select(.name == "lvgl_theme_shadcn_sys") | .req')
          echo "lvgl_theme_shadcn=$theme lvgl_theme_shadcn_sys=$sys pin=$pin"
          test "$theme" = "$sys"
          test "$pin" = "=$theme"
          scripts/sync-version.sh
          if ! git diff --exit-code; then
            echo "::error::C manifest versions differ from the Cargo workspace version, run scripts/sync-version.sh"
            exit 1
          fi

      - name: Build LVGL
        run: |
          cmake -S rust/ci -B build-rust-ci -DCMAKE_BUILD_TYPE=Release
          cmake --build build-rust-ci --parallel
          {
            echo "LVGL_INCLUDE_DIR=$PWD/build-rust-ci/_deps/lvgl-src"
            echo "LV_CONF_PATH=$PWD/rust/ci/conf"
            echo "LVGL_LIB_DIR=$PWD/build-rust-ci/lib"
          } >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --workspace

      - name: Integration tests are linked
        run: |
          tests=$(cargo test --workspace -- --list)
          for name in palette_layout_matches_c theme_lifecycle_and_helpers; do
            if ! printf '%s\n' "$tests" | grep -q "^$name: test$"; then
              echo "::error::Integration test $name was not built, check LVGL_LIB_DIR"
              exit 1
            fi
          done

      - name: Package
        run: cargo package --workspace

  release-plz-release:
    needs: validate
    if: github.repository_owner == 'AlixANNERAUD'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch LVGL headers
        run: |
          git clone --quiet --depth 1 --branch v9.6.0 https://github.com/lvgl/lvgl.git "$RUNNER_TEMP/lvgl"
          {
            echo "LVGL_INCLUDE_DIR=$RUNNER_TEMP/lvgl"
            echo "LV_CONF_PATH=$PWD/rust/ci/conf"
          } >> "$GITHUB_ENV"

      - name: Release
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Released version
        id: version
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          version=$(echo "$RELEASES" | jq -r '.[] | select(.package_name == "lvgl_theme_shadcn") | .version')
          echo "Released lvgl_theme_shadcn $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish-platformio:
    needs: release-plz-release
    if: needs.release-plz-release.outputs.version != ''
    permissions:
      contents: read
    uses: ./.github/workflows/publish-platformio.yml
    with:
      version: ${{ needs.release-plz-release.outputs.version }}
    secrets:
      PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}

  release-plz-pr:
    needs: validate
    if: github.repository_owner == 'AlixANNERAUD'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch LVGL headers
        run: |
          git clone --quiet --depth 1 --branch v9.6.0 https://github.com/lvgl/lvgl.git "$RUNNER_TEMP/lvgl"
          {
            echo "LVGL_INCLUDE_DIR=$RUNNER_TEMP/lvgl"
            echo "LV_CONF_PATH=$PWD/rust/ci/conf"
          } >> "$GITHUB_ENV"

      - name: Release PR
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Check out the Release PR
        if: steps.release-plz.outputs.prs_created == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release-plz.outputs.pr).head_branch }}
          token: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
          path: release-pr

      - name: Sync C manifest versions
        if: steps.release-plz.outputs.prs_created == 'true'
        working-directory: release-pr
        run: |
          scripts/sync-version.sh
          if git diff --quiet; then
            echo "C manifests already match the Cargo version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "chore: sync c manifest versions"
          git push origin HEAD
